name: Deploy to GitHub Pages

# Builds FSTEdit and publishes it at https://offware-apps.github.io/FSTEdit/.
# The build uses relative paths, so the same files work under any folder.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # skips onnxruntime-node's download of native binaries, which only Node uses and the page never loads
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # skips onnxruntime-node's download of native binaries, which only Node uses and the page never loads
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # one test measures the exported MP4 with ffprobe
      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
